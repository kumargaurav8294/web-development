<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Background Page</title>

    <style>
        /* Remove default spacing */
        * {
            margin: 0;
            padding: 0;
            
        }

        /* Full-screen background */
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Fixed background image */
        .background {
            position: fixed;
            top: 0;
            left: 0;
           background-image: url("Gaurav.jpeg");
            height: 100%; width: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* Common name styling */
        .name {
            position: fixed;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 5px black;
        }

        /* Four corners */
        .top-left {
            top: 20px;
            left: 20px;
        }

        .top-right {
            top: 20px;
            right: 20px;
        }

        .bottom-left {
            bottom: 20px;
            left: 20px;
        }

        .bottom-right {
            bottom: 20px;
            right: 20px;
        }

        /* Center name */
        .center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 45px;
        }
    </style>
</head>

<body>

    <div class="background">

    <div class="name top-left" >Kumar Gaurav</div>
    <div class="name top-right">Kumar Gaurav</div>
    <div class="name bottom-left">Kumar Gaurav</div>
    <div class="name bottom-right">Kumar Gaurav</div>
    <div class="name center">Kumar Gaurav</div>
</div>
</body>
</html>
