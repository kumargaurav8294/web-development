    <title>Student Details Table</title>

                <td align="right">23456</td>
            </tr>
            <tr>
                <td>3</td>
                <td class="left-align">Vishal</td>

                <td align="right">34567</td>
            </tr>
            <tr>
                <td>4</td>

</body>
</html>
